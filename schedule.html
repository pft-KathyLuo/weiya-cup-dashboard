<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>尾牙競賽｜賽程表</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/common.css?v=20261125b">
  <style>
    main { max-width: 860px; margin: auto; padding: 42px 26px 60px; }
    h1 { font-size: clamp(30px, 4vw, 44px); letter-spacing: -1px; margin: 0 0 26px; }

    .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
    .timeline::before { content: ''; position: absolute; left: 15px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
    .stage { position: relative; padding: 0 0 18px 50px; }
    .dot { position: absolute; left: 6px; top: 22px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid #c4cec9; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 18px 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .title b { font-size: 18px; display: block; line-height: 1.3; }
    .title small { color: var(--muted); font-size: 13px; }
    .note { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .dates { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 55%; }
    .date { background: #f3f7f4; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; text-align: center; line-height: 1.25; min-width: 86px; }
    .date b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
    .date small { font-size: 11px; color: var(--muted); }
    .badge { display: table; margin-top: 8px; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; }

    .stage.done { opacity: .55; }
    .stage.done .dot { background: #c4cec9; border-color: #c4cec9; }
    .stage.done .badge { background: #eef1ef; color: var(--muted); }
    .stage.now .dot { background: var(--green); border-color: var(--green); box-shadow: 0 0 0 5px #087f7226; }
    .stage.now .card { border: 2px solid var(--green); box-shadow: 0 10px 26px #087f7218; }
    .stage.now .badge { background: var(--green); color: #fff; }
    .stage.next .dot { border-color: var(--green); }
    .stage.next .badge { background: #e7f3ee; color: var(--green); }
    .stage.final .card { background: linear-gradient(135deg, #fff 60%, #fff6df); border-color: #f1d28a; }
    .stage.final .dot { border-color: var(--yellow); }

    /* 每個階段的代表色：時間軸小色塊、月曆圓點、圖例共用 */
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 7px; vertical-align: 1px; }

    /* 小月曆 */
    .calwrap { margin-top: 34px; }
    .calwrap h2 { font-size: 20px; margin: 0 0 4px; }
    .calwrap h2 small { font-size: 13px; font-weight: 500; color: var(--muted); }
    .cals { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
    .month { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 16px; }
    .month h3 { margin: 0 0 10px; font-size: 16px; }
    .month h3 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .wd { font-size: 11px; color: var(--muted); padding-bottom: 4px; }
    .day { aspect-ratio: 1; display: grid; place-items: center; border-radius: 9px; font-size: 13px; font-variant-numeric: tabular-nums; position: relative; }
    .day.weekend { color: #9aa6a3; }
    .day.reg { background: #cfe6dc; color: var(--ink); }
    .day.match { background: var(--c); color: #fff; font-weight: 800; }
    .day.today { outline: 2px solid var(--ink); outline-offset: -2px; }
    .day.today::after { content: '今天'; position: absolute; bottom: -1px; font-size: 8px; font-weight: 700; }
    .day.match.past { opacity: .45; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 12px; color: var(--muted); }
    .legend .swatch.reg { background: #cfe6dc; }

    @media (max-width: 600px) {
      .cals { grid-template-columns: 1fr; }
      header { padding: 0 15px; }
      main { padding: 28px 14px 48px; }
      .stage { padding-left: 40px; }
      .timeline::before { left: 11px; }
      .dot { left: 2px; }
      .card { flex-direction: column; padding: 16px; }
      .dates { justify-content: flex-start; max-width: none; }
    }
  </style>
</head>
<body>
  <header>
  <div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div><span>尾牙遊戲競賽<small>Year-End Game Cup</small></span></div>
  <div class="menuwrap">
    <button id="menuBtn" class="menubtn" aria-expanded="false" aria-controls="menuList">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>選單 Menu
    </button>
    <nav id="menuList" class="menu" hidden>
      <a href="./"><b>已報名名單</b><small>Registration</small></a>
      <a class="active" href="schedule.html"><b>賽程表</b><small>Schedule</small></a>
      <span class="disabled" aria-disabled="true"><b>海選成績</b><small>Qualifier Scores · 尚未開放 Coming soon</small></span>
      <a href="play.html"><b>三分鐘試玩</b><small>3-Min Practice</small></a>
      <a href="qa.html"><b>問答</b><small>Q&amp;A</small></a>
    </nav>
  </div>
</header>
  <script src="assets/menu.js?v=20261125b"></script>
  <main>
    <h1>賽程表<span class="en">Schedule</span></h1>
    <ol id="timeline" class="timeline"></ol>

    <section class="calwrap">
      <h2>月曆 <small>Calendar</small></h2>
      <div id="cals" class="cals"></div>
      <div id="legend" class="legend"></div>
    </section>
  </main>
  <script src="assets/schedule-data.js?v=20261125b"></script>
  <script>
  (function () {
    var WEEK_ZH = '日一二三四五六', WEEK_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MONTH_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    // 今天（台灣時間），格式 YYYY-MM-DD，可以直接用字串比大小
    var today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function parts(iso) { var d = new Date(iso + 'T12:00:00+08:00'); return { m: d.getUTCMonth(), d: d.getUTCDate(), w: d.getUTCDay() }; }
    function daysUntil(iso) { return Math.round((new Date(iso + 'T00:00:00+08:00') - new Date(today + 'T00:00:00+08:00')) / 86400000); }

    var nextMarked = false;
    STAGES.forEach(function (s) {
      var first = s.dates ? s.dates[0] : null, last = s.dates ? s.dates[s.dates.length - 1] : s.until;
      var state = today > last ? 'done' : (!first || today >= first) ? 'now' : 'upcoming';
      if (state === 'upcoming' && !nextMarked) { state = 'next'; nextMarked = true; }

      var li = el('li', 'stage ' + state + (s.final ? ' final' : ''));
      li.append(el('span', 'dot'));
      var card = el('div', 'card'), title = el('div', 'title');
      var name = el('b'), sw = el('span', 'swatch');
      sw.style.setProperty('--c', s.color);
      name.append(sw, document.createTextNode(s.zh));
      title.append(name, el('small', null, s.en));
      if (s.note) { var n = el('div', 'note'); n.append(document.createTextNode(s.note)); n.append(el('span', 'en', s.noteEn)); title.append(n); }

      var label = { done: '已結束 Done', now: '進行中 Now', next: '下一階段 Up next', upcoming: '' }[state];
      if (state === 'now' && s.until) { var left = daysUntil(s.until); label += ' · 還剩 ' + left + ' 天 ' + left + ' days left'; }
      if (label) title.append(el('span', 'badge', label));

      var dates = el('div', 'dates');
      (s.dates || [s.until]).forEach(function (iso) {
        var p = parts(iso), chip = el('div', 'date');
        chip.append(el('b', null, (p.m + 1) + '/' + p.d + '（' + WEEK_ZH[p.w] + '）'));
        chip.append(el('small', null, (s.until ? 'Until ' : '') + WEEK_EN[p.w] + ', ' + MONTH_EN[p.m] + ' ' + p.d));
        dates.append(chip);
      });
      card.append(title, dates);
      li.append(card);
      document.getElementById('timeline').append(li);
    });

    // ---- 小月曆：比賽日用該階段顏色標示，報名期間淺色，今天加外框 ----
    var byDate = {}, reg = null, months = {};
    STAGES.forEach(function (s) {
      if (s.until) reg = s;
      (s.dates || [s.until]).forEach(function (iso) { if (s.dates) byDate[iso] = s; months[iso.slice(0, 7)] = true; });
    });
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    // 淺色底用深色字、深色底用白字
    function light(hex) { var n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 150; }

    Object.keys(months).sort().forEach(function (ym) {
      var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1;
      var box = el('div', 'month'), h = el('h3', null, y + ' 年 ' + (m + 1) + ' 月');
      h.append(el('small', null, MONTH_EN[m] + ' ' + y));
      var grid = el('div', 'grid');
      WEEK_ZH.split('').forEach(function (w) { grid.append(el('div', 'wd', w)); });
      var firstW = new Date(Date.UTC(y, m, 1)).getUTCDay(), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
      for (var i = 0; i < firstW; i++) grid.append(el('div'));
      for (var d = 1; d <= days; d++) {
        var iso = y + '-' + pad(m + 1) + '-' + pad(d), w = (firstW + d - 1) % 7, s = byDate[iso];
        var cell = el('div', 'day' + (w === 0 || w === 6 ? ' weekend' : ''), String(d));
        if (s) {
          cell.className += ' match' + (iso < today ? ' past' : '');
          cell.style.setProperty('--c', s.color);
          cell.style.color = light(s.color) ? 'var(--ink)' : '#fff';
          cell.title = s.zh + ' ' + s.en;
        } else if (reg && iso <= reg.until) {
          cell.className += ' reg';
          cell.title = reg.zh + ' ' + reg.en;
        }
        if (iso === today) cell.className += ' today';
        grid.append(cell);
      }
      box.append(h, grid);
      document.getElementById('cals').append(box);
    });

    STAGES.forEach(function (s) {
      var item = el('span'), sw = el('span', 'swatch' + (s.until ? ' reg' : ''));
      sw.style.setProperty('--c', s.color);
      item.append(sw, document.createTextNode(s.zh + ' ' + s.en));
      document.getElementById('legend').append(item);
    });
  })();
  </script>
</body>
</html>
